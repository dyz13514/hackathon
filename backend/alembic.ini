[alembic]
script_location = migrations
prepend_sys_path = .
# The connection string is deliberately absent here: migrations/env.py reads
# DATABASE_URL from app.settings so credentials have exactly one entry point (R23.11).
# NOTE: keep this file pure ASCII. Alembic reads alembic.ini with encoding="locale",
# which is GBK on some Windows hosts and would fail on UTF-8 bytes.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
